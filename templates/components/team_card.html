{# Team Member Card Component #}
<div class="team-card bg-white rounded-lg border border-charcoal-100 shadow-card hover:shadow-card-hover overflow-hidden transition-all duration-300 flex flex-col group">
  <div class="photo-wrap relative h-72 w-full bg-charcoal-800 overflow-hidden">
    {% if member.photo %}
      <img src="{{ member.photo.url }}"
           alt="{{ member.photo_alt|default:member.name }}"
           class="w-full h-full object-cover object-top transition-transform duration-500 group-hover:scale-105"
           loading="lazy" />
    {% else %}
      <div class="w-full h-full flex items-center justify-center bg-charcoal-800 text-charcoal-400">
        <svg class="w-20 h-20" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
    {% endif %}

    {% if member.is_founder %}
    <div class="absolute top-3 left-3 bg-gold text-charcoal-950 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded shadow-md">
      Managing Partner
    </div>
    {% endif %}
  </div>

  <div class="p-6 flex-1 flex flex-col justify-between text-center">
    <div>
      <h3 class="font-display text-xl font-bold text-charcoal-900 mb-1">
        {{ member.name }}
      </h3>
      <p class="text-gold text-xs font-semibold uppercase tracking-wider mb-4">
        {{ member.designation }}
      </p>
      <p class="text-charcoal-600 text-xs leading-relaxed line-clamp-3 mb-4">
        {{ member.bio }}
      </p>
    </div>

    {% if member.linkedin_url %}
    <div class="pt-3 border-t border-charcoal-100 flex justify-center">
      <a href="{{ member.linkedin_url }}"
         target="_blank"
         rel="noopener noreferrer"
         class="text-charcoal-400 hover:text-gold transition-colors duration-200"
         aria-label="LinkedIn profile for {{ member.name }}">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.45 1.45 0 1 0 0-2.9 1.45 1.45 0 0 0 0 2.9m1.4 9.74V9.96H5.06v8.54z"/></svg>
      </a>
    </div>
    {% endif %}
  </div>
</div>
